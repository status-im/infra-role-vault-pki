---
- name: 'Vault PKI | Validate local certificate paths'
  ansible.builtin.assert:
    that:
      - cert_certificate_path | default('', true) | string | length > 0
      - cert_private_key_path | default('', true) | string | length > 0
    fail_msg: 'cert_certificate_path and cert_private_key_path are required'

- name: 'Vault PKI | Check local certificate'
  ansible.builtin.stat:
    path: '{{ cert_certificate_path }}'
  register: cert_certificate_stat

- name: 'Vault PKI | Check local private key'
  ansible.builtin.stat:
    path: '{{ cert_private_key_path }}'
  register: cert_private_key_stat
  no_log: true

- name: 'Vault PKI | Read local certificate expiration'
  community.crypto.x509_certificate_info:
    path: '{{ cert_certificate_path }}'
    valid_at:
      renewal_window: '{{ cert_renew_before }}'
  register: cert_certificate_info
  failed_when: false
  when: cert_certificate_stat.stat.exists

- name: 'Vault PKI | Decide if certificate generation is needed'
  ansible.builtin.set_fact:
    cert_needs_generation: >-
      {{
        not cert_certificate_stat.stat.exists
        or not cert_private_key_stat.stat.exists
        or (cert_certificate_info.failed | default(false))
        or not (cert_certificate_info.valid_at.renewal_window | default(false))
      }}
